name: gramalote

# Stack completo de Gramalote: nginx (SPA) + API Express + MySQL.
#
# Este es el archivo estándar: compila las dos imágenes desde el repositorio y
# sirve el sitio en http://localhost:8080 (o el puerto del contenedor `web`).
#
#   docker compose up -d --build
#
# Funciona igual en el PC (Docker Desktop) y en un servidor Linux con Docker:
# deploy/levantar-debian.sh lo levanta así y solo añade datos y cortafuegos.
#
# En AWS no se compila nada: deploy/desplegar-ec2.sh aplica el overlay
# docker-compose.aws.yml, que cambia las imágenes por las de ECR, publica el 80
# (origen de CloudFront) y ajusta los saltos de proxy:
#
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d
#
# Las variables sensibles viven en .env (local) o en /opt/gramalote/.env (EC2) y
# nunca se versionan; el compose solo las interpola.

services:
  web:
    image: gramalote-web:local
    build:
      context: ./frontend
    container_name: gramalote-web
    restart: unless-stopped
    ports:
      # 8080 para no chocar con un nginx/apache del sistema (PORT lo cambia, y
      # deploy/levantar-debian.sh lo respeta). El overlay de AWS lo sustituye
      # por el 80, que es el origen de CloudFront.
      - "${PORT:-8080}:80"
    volumes:
      # Imágenes subidas desde el panel: nginx las sirve en solo lectura.
      - ${MEDIA_DIR:-/opt/gramalote/media}:/srv/media:ro
      # Mapa PMTiles de la región (docs/MAPA-TESELAS.md); no va en Git ni en la imagen.
      - ${TILES_DIR:-/opt/gramalote/tiles}:/srv/tiles:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - gramalote

  api:
    image: gramalote-api:local
    build:
      context: ./backend
    container_name: gramalote-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en /opt/gramalote/.env}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_IDLE_MINUTES: ${AUTH_IDLE_MINUTES:-30}
      AUTH_MAX_HOURS: ${AUTH_MAX_HOURS:-8}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Un solo proxy delante (nginx). En AWS son 2 (CloudFront → nginx) y lo
      # pone docker-compose.aws.yml, para que req.ip sea la IP del visitante.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://d2nm90ise1l8de.cloudfront.net}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gramalote}
      MYSQL_USER: ${MYSQL_USER:-gramalote}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      # Correo (Panel › Correo). Opcionales: base de los enlaces de los correos y
      # llave propia para cifrar la contraseña SMTP (si no, se deriva de JWT_SECRET).
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://d2nm90ise1l8de.cloudfront.net}
      MAIL_SECRET_KEY: ${MAIL_SECRET_KEY:-}
      MEDIA_ROOT: /app/media
      MEDIA_PUBLIC_BASE: /media
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-8}
      MEDIA_QUOTA_MB: ${MEDIA_QUOTA_MB:-500}
      MEDIA_VARIANTS: ${MEDIA_VARIANTS:-480,960,1440}
    volumes:
      # Disco de la máquina, sin S3: se migra con rsync a un servidor físico.
      - ${MEDIA_DIR:-/opt/gramalote/media}:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - gramalote

  db:
    image: mysql:8.4
    container_name: gramalote-db
    restart: unless-stopped
    # Antes de arrancar MySQL deja las claves iguales a las del .env: así un
    # volumen creado con otro .env (otro clon, .env regenerado) no deja la API
    # en «Access denied». Ver backend/database/db-arranque.sh.
    entrypoint: ["bash", "/usr/local/bin/db-arranque.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gramalote}
      MYSQL_USER: ${MYSQL_USER:-gramalote}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      TZ: America/Bogota
    # Ajustado a los 913 MB de la t3.micro: sin performance_schema y con un
    # buffer pool pequeño, MySQL queda en ~250 MB.
    command:
      - --default-time-zone=-05:00
      - --log-bin-trust-function-creators=1
      - --innodb-buffer-pool-size=96M
      - --performance-schema=OFF
      - --mysqlx=0
      - --skip-name-resolve
    volumes:
      - gramalote_db:/var/lib/mysql
      - ./backend/database/db-arranque.sh:/usr/local/bin/db-arranque.sh:ro
      # Solo se ejecutan la primera vez que se crea el volumen. Los .sql viven en
      # backend/database/ del repo; deploy/desplegar-ec2.sh los deja ahí mismo en
      # la instancia.
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./backend/database/seed-content.sql:/docker-entrypoint-initdb.d/03-seed-content.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - gramalote

volumes:
  gramalote_db:

networks:
  gramalote:
