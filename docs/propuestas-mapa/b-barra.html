<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa · Propuesta B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Base compartida por las 3 propuestas de /mapa (prototipo local, no producción). */
:root {
  --c-cream: #fff2e3;
  --c-cream-deep: #ebdccf;
  --c-navy: #00426b;
  --c-navy-dark: #00324f;
  --c-coral: #db5319;
  --c-coral-dark: #b9410f;
  --c-gold: #eaa41e;
  --c-ink: #141414;
  --c-ink-soft: #4b3b2f;
  --c-muted: #6b6158;
  --c-line: #e6d7c8;
  --c-white: #ffffff;
  --c-open: #2f7d4f;
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --header-h: 100px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-pill: 999px;
  --shadow-chip: 0 2px 10px rgba(20, 20, 20, 0.14);
  --shadow-soft: 0 18px 40px rgba(20, 20, 20, 0.16);
}
@media (max-width: 760px) {
  :root { --header-h: 64px; }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  color: var(--c-ink);
  background: var(--c-cream);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* Cabecera simulada del sitio (solo contexto) */
.sitio {
  height: var(--header-h);
  background: var(--c-navy);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(16px, 4vw, 56px);
}
.sitio__marca { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; }
.sitio__marca small { display: block; font-family: var(--font-sans); font-size: .7rem; font-weight: 500; opacity: .75; letter-spacing: .08em; text-transform: uppercase; }
.sitio nav { display: flex; gap: 28px; font-size: .95rem; }
.sitio nav a { color: #fff; text-decoration: none; opacity: .85; }
.sitio nav a.is-on { opacity: 1; font-weight: 700; border-bottom: 2px solid var(--c-gold); padding-bottom: 4px; }
.sitio__menu { display: none; background: none; border: 0; color: #fff; font-size: 1.6rem; }
@media (max-width: 760px) {
  .sitio nav { display: none; }
  .sitio__menu { display: block; }
  .sitio__marca { font-size: 1.2rem; }
}

/* Etiqueta de la propuesta (no va en producción) */
.propuesta-tag {
  position: fixed; z-index: 2000; left: 50%; bottom: 10px; transform: translateX(-50%);
  background: rgba(20, 20, 20, .82); color: #fff; font-size: .75rem;
  padding: 6px 12px; border-radius: var(--radius-pill); pointer-events: none; white-space: nowrap;
}
.propuesta-tag a { pointer-events: auto; color: var(--c-gold); }
@media (max-width: 760px) {
  .propuesta-tag { left: 10px; bottom: 26px; transform: none; font-size: .66rem; }
  /* En móvil se hace zoom con los dedos; los botones + / − estorban */
  .leaflet-control-zoom { display: none; }
}

/* Mapa */
#mapa { position: absolute; inset: 0; background: #e8e2d6; }
.leaflet-container { font-family: var(--font-sans); }
.pin { background: none; border: 0; }
.pin img {
  width: 40px; height: 40px; display: block;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.35));
  transition: transform .15s;
}
.pin.is-sel img { transform: scale(1.3); }

/* Calificación: número + estrella (0 si no hay votos) */
.nota {
  display: inline-flex; align-items: center; gap: 3px;
  font-weight: 700; font-size: .85rem; color: var(--c-ink); white-space: nowrap;
}
.nota svg { width: 14px; height: 14px; fill: var(--c-gold); }
.nota.is-cero { color: var(--c-muted); }
.nota.is-cero svg { fill: #cfc4b8; }
.estrellas { display: inline-flex; gap: 1px; }
.estrellas svg { width: 13px; height: 13px; fill: var(--c-gold); }
.estrellas svg.vacia { fill: #d8cdbf; }

.estado { font-size: .75rem; font-weight: 700; }
.estado.is-open { color: var(--c-open); }
.estado.is-closed { color: var(--c-muted); }

/* Ficha emergente sobre el mapa */
.ficha .leaflet-popup-content-wrapper { border-radius: var(--radius-md); padding: 0; overflow: hidden; }
.ficha .leaflet-popup-content { margin: 0; width: 250px !important; }
.ficha img { width: 100%; height: 120px; object-fit: cover; display: block; background: var(--c-cream-deep); }
.ficha__txt { padding: 12px 14px 14px; display: grid; gap: 4px; }
.ficha__txt strong { font-size: 1rem; }
.ficha__txt span { color: var(--c-muted); font-size: .82rem; }
.ficha__acc { display: flex; gap: 8px; margin-top: 8px; }
.ficha__acc a {
  flex: 1; text-align: center; text-decoration: none; font-size: .8rem; font-weight: 700;
  padding: 8px 10px; border-radius: var(--radius-pill);
}
.ficha__acc a:first-child { background: var(--c-navy); color: #fff; }
.ficha__acc a:last-child { border: 1px solid var(--c-line); color: var(--c-navy); }

/* Botón X para quitar filtros */
.quitar {
  display: none; align-items: center; justify-content: center; gap: 6px;
  height: 40px; min-width: 40px; padding: 0 12px;
  border-radius: var(--radius-pill); border: 0;
  background: var(--c-ink); color: #fff; font-weight: 700; font-size: .85rem;
  box-shadow: var(--shadow-chip); flex: none;
}
.quitar.is-visible { display: inline-flex; }

/* Menú desplegable de un filtro (A y C) */
.pop {
  position: fixed; z-index: 1500; min-width: 210px; max-height: 60vh; overflow: auto;
  background: #fff; border-radius: var(--radius-sm); box-shadow: var(--shadow-soft);
  padding: 6px; display: none;
}
.pop.is-open { display: block; }
.pop button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: .9rem;
}
.pop button:hover { background: var(--c-cream); }
.pop button.is-on { background: #fde6da; color: var(--c-coral-dark); font-weight: 700; }
.pop .punto { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pop .vacio { color: var(--c-muted); font-size: .85rem; padding: 10px 12px; }

/* Velo para ventanas emergentes en móvil */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1200; opacity: 0; pointer-events: none; transition: opacity .2s; }
.velo.is-open { opacity: 1; pointer-events: auto; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<style>
/* ===== Propuesta B · Barra única con selectores nativos + lista agrupada ===== */
.app { display: grid; grid-template-columns: 320px 1fr; height: calc(100dvh - var(--header-h)); }
.lado { display: flex; flex-direction: column; background: var(--c-cream); border-right: 1px solid var(--c-line); min-height: 0; z-index: 2; }
.lado__cab { padding: 16px; border-bottom: 1px solid var(--c-line); background: #fff; }

.buscar { position: relative; display: flex; align-items: center; }
.buscar svg { position: absolute; left: 12px; width: 18px; height: 18px; stroke: var(--c-navy); fill: none; stroke-width: 2.2; }
.buscar input {
  width: 100%; height: 44px; padding: 0 40px 0 40px; border-radius: 10px;
  border: 2px solid var(--c-line); background: #fff; outline: none;
}
.buscar input:focus { border-color: var(--c-navy); }
.buscar input::-webkit-search-cancel-button { display: none; }
.buscar__x { position: absolute; right: 6px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--c-cream); display: none; }
.buscar.has-q .buscar__x { display: block; }

.lista { list-style: none; margin: 0; padding: 0 0 24px; overflow: auto; flex: 1; }
.grupo-t {
  position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 6px; background: var(--c-cream); font-size: .72rem; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: var(--c-ink-soft);
}
.grupo-t i { width: 8px; height: 8px; border-radius: 50%; }
.grupo-t span { margin-left: auto; font-weight: 500; color: var(--c-muted); }
.lugar {
  display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; width: 100%;
  padding: 9px 16px; border: 0; background: none; text-align: left; border-bottom: 1px solid rgba(230,215,200,.6);
}
.lugar:hover { background: #fff; }
.lugar.is-sel { background: #fff; box-shadow: inset 4px 0 0 var(--c-coral); }
.lugar img { width: 36px; height: 36px; }
.lugar__txt { min-width: 0; display: grid; }
.lugar__txt strong { font-size: .92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lugar__txt span { font-size: .76rem; color: var(--c-muted); }
.lugar__der { display: grid; justify-items: end; gap: 2px; }
.sin { padding: 28px 16px; color: var(--c-muted); font-size: .9rem; text-align: center; }

.escena { position: relative; min-width: 0; }

/* Barra de filtros: una sola pieza blanca con segmentos */
.filtros {
  position: absolute; z-index: 1100; top: 16px; left: 16px; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 8px;
}
.barra {
  display: flex; align-items: stretch; background: #fff; border-radius: 14px;
  box-shadow: var(--shadow-chip); overflow: hidden;
}
.seg { position: relative; display: flex; align-items: center; border-left: 1px solid var(--c-line); }
.seg:first-child { border-left: 0; }
.seg select {
  appearance: none; border: 0; background: transparent; height: 46px; padding: 0 34px 0 16px;
  font-weight: 500; font-size: .9rem; cursor: pointer; outline: none; max-width: 200px;
  text-overflow: ellipsis;
}
.seg::after { content: ''; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; opacity: .6; }
.seg--check::after { display: none; }
.seg--check label { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 46px; cursor: pointer; font-weight: 500; font-size: .9rem; white-space: nowrap; }
.seg--check input { width: 18px; height: 18px; accent-color: #fff; margin: 0; }
.seg:hover { background: var(--c-cream); }
.seg.is-on { background: var(--c-coral); color: #fff; }
.seg.is-on select, .seg.is-on label { font-weight: 700; color: #fff; }
.seg.is-on + .seg { border-left-color: transparent; }
.seg select:focus-visible { box-shadow: inset 0 0 0 3px rgba(0,66,107,.35); }
.seg option { color: var(--c-ink); background: #fff; }
.quitar { height: 46px; width: 46px; padding: 0; border-radius: 14px; }

.fab, .panel { display: none; }

@media (max-width: 760px) {
  .app { display: block; position: relative; }
  .escena { position: absolute; inset: 0; }
  .lado { position: absolute; z-index: 1150; top: 12px; left: 12px; right: 12px; background: none; border: 0; display: block; }
  .lado__cab { padding: 0; background: none; border: 0; }
  .lado .lista { display: none; }
  .buscar input { border: 0; box-shadow: var(--shadow-chip); height: 48px; border-radius: 12px; }
  .filtros {
    top: 70px; left: 0; right: 0; max-width: none; padding: 2px 12px 10px; overflow-x: auto; scrollbar-width: none;
  }
  .filtros::-webkit-scrollbar { display: none; }
  /* La barra se separa en piezas para que se pueda desplazar */
  .barra { background: none; box-shadow: none; overflow: visible; gap: 8px; }
  .seg { border: 0 !important; background: #fff; border-radius: 12px; box-shadow: var(--shadow-chip); flex: none; }
  .seg select, .seg--check label { height: 42px; }
  .quitar { order: -1; height: 42px; width: 42px; border-radius: 12px; }

  .fab {
    display: inline-flex; align-items: center; gap: 8px; position: absolute; z-index: 1100; right: 16px; bottom: 28px;
    height: 50px; padding: 0 20px; border-radius: var(--radius-pill); border: 0;
    background: var(--c-navy); color: #fff; font-weight: 700; box-shadow: var(--shadow-soft);
  }
  .fab svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }

  /* Lista a pantalla completa */
  .panel {
    display: flex; flex-direction: column; position: fixed; inset: 0; z-index: 1300; background: var(--c-cream);
    transform: translateY(100%); transition: transform .25s ease; visibility: hidden;
  }
  .panel.is-open { transform: none; visibility: visible; }
  .panel__cab { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--c-line); }
  .panel__cab h2 { margin: 0; font-size: 1.05rem; flex: 1; }
  .panel__cab small { display: block; font-weight: 400; color: var(--c-muted); font-size: .78rem; }
  .volver { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--radius-pill); border: 0; background: var(--c-navy); color: #fff; font-weight: 700; font-size: .85rem; }
  .panel .lista { display: block; }
}
</style>
</head>

<div class="app">

        <button type="button" class="buscar__x" id="q-x" aria-label="Borrar búsqueda">✕</button>

    </div>

  </aside>

  <main class="escena">
    <div id="mapa"></div>

        <div class="seg seg--check" id="s-abierto"><label><input type="checkbox" id="abierto"> Abierto</label></div>
      </div>
      <button type="button" class="quitar" id="quitar" aria-label="Quitar filtros" title="Quitar filtros">✕</button>
    </div>
    <button type="button" class="fab" id="fab" aria-controls="panel">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      <span id="fab-t">Lista</span>
    </button>
  </main>
</div>

<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-t">
  <div class="panel__cab">
    <h2 id="panel-t"><span id="panel-n"></span><small id="panel-f"></small></h2>
    <button type="button" class="volver" id="cerrar">✕ Mapa</button>
  </div>
  <ul class="lista" id="lista-m"></ul>
</section>

    ['Lonchería Romero','e','comer','Restaurante',0,false,7.915291,-72.786325,'comidas-ejecutivas','/media/establishments/27/ec994c9c-21db-44c3-a494-bf8fa9fc307d-cover.webp'],
    ['Sombreros TECHA','e','comprar','Artesanía',0,false,7.9161583,-72.7875621,'artesanias','/media/establishments/26/95df01ed-1b51-4945-8e8e-c31cc0e7d459-cover.webp'],
    ['Yawart','e','comprar','Artesanía',0,null,7.9195026,-72.7847273,'artesanias','/media/establishments/23/055eb98c-397f-42c4-abea-50f96b01a80f-cover.webp'],
    ['Pueblo Viejo','x','experiencia','Patrimonio',0,null,7.9015955,-72.7983908,'monumento','/img/que-hacer/pueblo-viejo.jpg'],
    ['Las ruinas del antiguo Gramalote','x','experiencia','Patrimonio',0,null,7.8878061,-72.7977203,'monumento','/img/que-hacer/ruinas.jpg'],
    ['Nuevo Gramalote','x','experiencia','Patrimonio',0,null,7.9150179,-72.7855365,'monumento','/img/que-hacer/nuevo-gramalote.jpg'],
    ['Cascadas Arco Iris','x','experiencia','Naturaleza',0,null,7.8827262,-72.7803418,'cascada','/img/experiencias/cascadas/hero.jpg'],
    ['Café Marquetalia','x','experiencia','Naturaleza',0,null,7.93,-72.796,'cafeteria','/img/que-hacer/marquetalia.jpg'],
  ]

  const PLACES = RAW.map((r, i) => ({
    id: 'p' + i,
    name: r[0],
    group: r[2],
    categoryName: GROUP[r[2]].label,
    type: r[3],
    rating: r[4],
    openNow: r[5],
    lat: r[6],
    lng: r[7],
    icon: ICONOS + r[8] + '.svg',
    photo: BASE + r[9],
  }))

  const RATINGS = [
    { value: 0, label: 'Cualquiera' },
    { value: 1, label: '1+' },
    { value: 2, label: '2+' },
    { value: 3, label: '3+' },
    { value: 4, label: '4+' },
    { value: 5, label: '5' },
  ]

  // ---------- Estado y filtrado ----------
  const state = { q: '', group: '', minRating: 0, type: '', open: false, selected: '' }
  const listeners = []

  const normalize = (v) =>
    String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, '')

  function typesFor(group) {
    const set = new Set(PLACES.filter((p) => !group || p.group === group).map((p) => p.type))
    return [...set].sort((a, b) => a.localeCompare(b, 'es'))
  }

  function filtered() {
    const q = normalize(state.q)
    return PLACES.filter(
      (p) =>
        (!state.group || p.group === state.group) &&
        (!state.type || p.type === state.type) &&
        p.rating >= state.minRating &&
        (!state.open || p.openNow === true) &&
        (!q || normalize(p.name + p.type + p.categoryName).includes(q)),
    ).sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name, 'es'))
  }

  // La búsqueda no cuenta como filtro: la X solo limpia los filtros de la barra.
  function activeCount() {
    return (state.group ? 1 : 0) + (state.minRating ? 1 : 0) + (state.type ? 1 : 0) + (state.open ? 1 : 0)
  }

  function set(patch) {
    Object.assign(state, patch)
    if ('group' in patch && state.type && !typesFor(state.group).includes(state.type)) state.type = ''
    listeners.forEach((fn) => fn(state))
  }
  function clearFilters() {
    set({ group: '', minRating: 0, type: '', open: false })
  }
  function onChange(fn) {
    listeners.push(fn)
  }

  // ---------- Fragmentos de HTML ----------
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>'
  const fmt = (n) => n.toLocaleString('es-CO', { maximumFractionDigits: 1 })

  function nota(avg) {
    return `<span class="nota${avg ? '' : ' is-cero'}" aria-label="Calificación ${fmt(avg)} de 5">${fmt(avg)}${STAR}</span>`
  }
  function estrellas(n) {
    let html = '<span class="estrellas" aria-hidden="true">'
    for (let i = 1; i <= 5; i++) html += STAR.replace('<svg', i <= n ? '<svg' : '<svg class="vacia"')
    return html + '</span>'
  }
  function estado(p) {
    if (p.openNow === true) return '<span class="estado is-open">Abierto</span>'
    if (p.openNow === false) return '<span class="estado is-closed">Cerrado</span>'
    return ''
  }
  const subtitulo = (p) => `${p.categoryName} · ${p.type}`
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

  // ---------- Mapa (Leaflet solo para el prototipo; producción usa MapLibre) ----------
  function initMap(el, opts = {}) {
    const map = L.map(el, { zoomControl: false, attributionControl: true }).setView([7.912, -72.789], 14)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap',
    }).addTo(map)
    L.control.zoom({ position: opts.zoomPosition || 'bottomright' }).addTo(map)

    const markers = {}
    PLACES.forEach((p) => {
      const m = L.marker([p.lat, p.lng], {
        icon: L.divIcon({ className: 'pin', html: `<img src="${p.icon}" alt="">`, iconSize: [40, 40], iconAnchor: [20, 36] }),
        title: p.name,
      })
      m.on('click', () => select(p.id))
      markers[p.id] = m
    })

    function popupHtml(p) {
      return `<img src="${p.photo}" alt="" onerror="this.style.visibility='hidden'">
        <div class="ficha__txt"><strong>${esc(p.name)}</strong><span>${esc(subtitulo(p))}</span>
        <div style="display:flex;gap:10px;align-items:center">${nota(p.rating)} ${estado(p)}</div>
        <div class="ficha__acc"><a href="#">Ver ficha</a><a href="#">Cómo llegar</a></div></div>`
    }

    function select(id, fly) {
      const p = PLACES.find((x) => x.id === id)
      if (!p) return
      Object.values(markers).forEach((m) => m.getElement()?.classList.remove('is-sel'))
      markers[id].getElement()?.classList.add('is-sel')
      if (fly) map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 16), { duration: 0.5 })
      L.popup({ className: 'ficha', offset: [0, -30], maxWidth: 260, autoPanPaddingTopLeft: opts.padTL || [20, 120] })
        .setLatLng([p.lat, p.lng]).setContent(popupHtml(p)).openOn(map)
      set({ selected: id })
    }

    let lastKey = ''
    function render() {
      const list = filtered()
      const visible = new Set(list.map((p) => p.id))
      PLACES.forEach((p) => {
        const m = markers[p.id]
        if (visible.has(p.id)) m.addTo(map)
        else m.remove()
      })
      const key = list.map((p) => p.id).join()
      if (key !== lastKey && list.length) {
        lastKey = key
        map.invalidateSize()
        map.fitBounds(L.latLngBounds(list.map((p) => [p.lat, p.lng])), {
          paddingTopLeft: opts.padTL || [40, 120], paddingBottomRight: [40, 40], maxZoom: 16,
        })
      }
    }
    onChange(render)
    render()
    return { map, select }
  }

  // ---------- Menú desplegable posicionado bajo un chip ----------
  const pop = document.createElement('div')
  pop.className = 'pop'
  pop.setAttribute('role', 'menu')
  document.addEventListener('DOMContentLoaded', () => document.body.append(pop))
  let popAnchor = null
  function openPop(anchor, items, onPick) {
    if (popAnchor === anchor && pop.classList.contains('is-open')) return closePop()
    popAnchor = anchor
    pop.innerHTML = ''
    if (!items.length) pop.innerHTML = '<div class="vacio">Sin opciones</div>'
    items.forEach((it) => {
      const b = document.createElement('button')
      b.type = 'button'
      b.setAttribute('role', 'menuitemradio')
      b.setAttribute('aria-checked', String(!!it.on))
      if (it.on) b.className = 'is-on'
      b.innerHTML = it.html
      b.addEventListener('click', () => { onPick(it.value); closePop() })
      pop.append(b)
    })
    const r = anchor.getBoundingClientRect()
    pop.classList.add('is-open')
    const w = pop.offsetWidth
    pop.style.top = r.bottom + 6 + 'px'
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px'
    anchor.setAttribute('aria-expanded', 'true')
  }
  function closePop() {
    pop.classList.remove('is-open')
    popAnchor?.setAttribute('aria-expanded', 'false')
    popAnchor = null
  }
  document.addEventListener('click', (e) => {
    if (popAnchor && !pop.contains(e.target) && !popAnchor.contains(e.target)) closePop()
  })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop() })
  addEventListener('resize', closePop)
  document.addEventListener('scroll', closePop, true)

  // Opciones listas para los menús
  const groupItems = () => [
    { value: '', html: 'Todas las categorías', on: !state.group },
    ...GROUPS.map((g) => ({ value: g.key, on: state.group === g.key, html: `<span class="punto" style="background:${g.color}"></span>${g.label}` })),
  ]
  const ratingItems = () =>
    RATINGS.map((r) => ({
      value: r.value, on: state.minRating === r.value,
      html: r.value ? `<b style="min-width:22px">${r.label}</b>${estrellas(r.value)}` : 'Cualquier calificación',
    }))
  const typeItems = () => [
    { value: '', html: 'Todos los tipos', on: !state.type },
    ...typesFor(state.group).map((t) => ({ value: t, html: esc(t), on: state.type === t })),
  ]

  window.Mapa = {
    GROUPS, GROUP, PLACES, RATINGS, STAR, state, set, clearFilters, onChange, filtered, typesFor, activeCount,
    nota, estrellas, estado, subtitulo, esc, initMap, openPop, closePop, groupItems, ratingItems, typeItems,
    isMobile: () => matchMedia('(max-width: 760px)').matches,
  }
})()
</script>
<script>
const M = window.Mapa
const $ = (id) => document.getElementById(id)
const mapa = M.initMap($('mapa'), { padTL: [40, 90] })

$('q').addEventListener('input', (e) => M.set({ q: e.target.value }))
$('q-x').addEventListener('click', () => { $('q').value = ''; M.set({ q: '' }); $('q').focus() })
$('f-cat').addEventListener('change', (e) => M.set({ group: e.target.value }))
$('f-nota').addEventListener('change', (e) => M.set({ minRating: Number(e.target.value) }))
$('f-tipo').addEventListener('change', (e) => M.set({ type: e.target.value }))
$('abierto').addEventListener('change', (e) => M.set({ open: e.target.checked }))
$('quitar').addEventListener('click', M.clearFilters)

function abrir(v) {
  $('panel').classList.toggle('is-open', v)
  if (v) $('cerrar').focus()
}
$('fab').addEventListener('click', () => abrir(true))
$('cerrar').addEventListener('click', () => abrir(false))
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') abrir(false) })
document.addEventListener('click', (e) => {
  const b = e.target.closest('.lugar')
  if (!b) return
  abrir(false)
  mapa.select(b.dataset.id, true)
})

const opt = (v, t, sel) => `<option value="${v}"${sel ? ' selected' : ''}>${t}</option>`

function lista(list, s) {
  if (!list.length) return '<li class="sin">Ningún lugar coincide con la búsqueda o los filtros.</li>'
  return M.GROUPS.map((g) => {
    const items = list.filter((p) => p.group === g.key)
    if (!items.length) return ''
    return `<li class="grupo-t"><i style="background:${g.color}"></i>${g.label}<span>${items.length}</span></li>` +
      items.map((p) => `<li><button type="button" class="lugar${s.selected === p.id ? ' is-sel' : ''}" data-id="${p.id}">
        <img src="${p.icon}" alt=""><span class="lugar__txt"><strong>${M.esc(p.name)}</strong><span>${M.esc(p.type)}</span></span>
        <span class="lugar__der">${M.nota(p.rating)}${M.estado(p)}</span></button></li>`).join('')
  }).join('')
}

function render(s) {
  const list = M.filtered()
  $('f-cat').innerHTML = opt('', 'Categoría', !s.group) + M.GROUPS.map((g) => opt(g.key, g.label, s.group === g.key)).join('')
  $('f-nota').innerHTML = M.RATINGS.map((r) => opt(r.value, r.value ? `${r.label} ★` : 'Calificación', s.minRating === r.value)).join('')
  $('f-tipo').innerHTML = opt('', 'Tipo', !s.type) + M.typesFor(s.group).map((t) => opt(M.esc(t), M.esc(t), s.type === t)).join('')
  $('abierto').checked = s.open
  $('s-cat').classList.toggle('is-on', !!s.group)
  $('s-nota').classList.toggle('is-on', !!s.minRating)
  $('s-tipo').classList.toggle('is-on', !!s.type)
  $('s-abierto').classList.toggle('is-on', s.open)
  const n = M.activeCount()
  $('quitar').classList.toggle('is-visible', n > 0)
  $('buscar').classList.toggle('has-q', !!s.q)

  const html = lista(list, s)
  $('lista').innerHTML = html
  $('lista-m').innerHTML = html
  $('fab-t').textContent = `Lista · ${list.length}`
  $('panel-n').textContent = `${list.length} ${list.length === 1 ? 'lugar' : 'lugares'}`
  $('panel-f').textContent = n || s.q ? 'Según tu búsqueda y filtros' : 'Todos los lugares'
}
M.onChange(render)
render(M.state)
</script>
</body>
