<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa · Propuesta C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Base compartida por las 3 propuestas de /mapa (prototipo local, no producción). */
:root {
  --c-cream: #fff2e3;
  --c-cream-deep: #ebdccf;
  --c-navy: #00426b;
  --c-navy-dark: #00324f;
  --c-coral: #db5319;
  --c-coral-dark: #b9410f;
  --c-gold: #eaa41e;
  --c-ink: #141414;
  --c-ink-soft: #4b3b2f;
  --c-muted: #6b6158;
  --c-line: #e6d7c8;
  --c-white: #ffffff;
  --c-open: #2f7d4f;
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --header-h: 100px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-pill: 999px;
  --shadow-chip: 0 2px 10px rgba(20, 20, 20, 0.14);
  --shadow-soft: 0 18px 40px rgba(20, 20, 20, 0.16);
}
@media (max-width: 760px) {
  :root { --header-h: 64px; }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  color: var(--c-ink);
  background: var(--c-cream);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* Cabecera simulada del sitio (solo contexto) */
.sitio {
  height: var(--header-h);
  background: var(--c-navy);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(16px, 4vw, 56px);
}
.sitio__marca { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; }
.sitio__marca small { display: block; font-family: var(--font-sans); font-size: .7rem; font-weight: 500; opacity: .75; letter-spacing: .08em; text-transform: uppercase; }
.sitio nav { display: flex; gap: 28px; font-size: .95rem; }
.sitio nav a { color: #fff; text-decoration: none; opacity: .85; }
.sitio nav a.is-on { opacity: 1; font-weight: 700; border-bottom: 2px solid var(--c-gold); padding-bottom: 4px; }
.sitio__menu { display: none; background: none; border: 0; color: #fff; font-size: 1.6rem; }
@media (max-width: 760px) {
  .sitio nav { display: none; }
  .sitio__menu { display: block; }
  .sitio__marca { font-size: 1.2rem; }
}

/* Etiqueta de la propuesta (no va en producción) */
.propuesta-tag {
  position: fixed; z-index: 2000; left: 50%; bottom: 10px; transform: translateX(-50%);
  background: rgba(20, 20, 20, .82); color: #fff; font-size: .75rem;
  padding: 6px 12px; border-radius: var(--radius-pill); pointer-events: none; white-space: nowrap;
}
.propuesta-tag a { pointer-events: auto; color: var(--c-gold); }
@media (max-width: 760px) {
  .propuesta-tag { left: 10px; bottom: 26px; transform: none; font-size: .66rem; }
  /* En móvil se hace zoom con los dedos; los botones + / − estorban */
  .leaflet-control-zoom { display: none; }
}

/* Mapa */
#mapa { position: absolute; inset: 0; background: #e8e2d6; }
.leaflet-container { font-family: var(--font-sans); }
.pin { background: none; border: 0; }
.pin img {
  width: 40px; height: 40px; display: block;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.35));
  transition: transform .15s;
}
.pin.is-sel img { transform: scale(1.3); }

/* Calificación: número + estrella (0 si no hay votos) */
.nota {
  display: inline-flex; align-items: center; gap: 3px;
  font-weight: 700; font-size: .85rem; color: var(--c-ink); white-space: nowrap;
}
.nota svg { width: 14px; height: 14px; fill: var(--c-gold); }
.nota.is-cero { color: var(--c-muted); }
.nota.is-cero svg { fill: #cfc4b8; }
.estrellas { display: inline-flex; gap: 1px; }
.estrellas svg { width: 13px; height: 13px; fill: var(--c-gold); }
.estrellas svg.vacia { fill: #d8cdbf; }

.estado { font-size: .75rem; font-weight: 700; }
.estado.is-open { color: var(--c-open); }
.estado.is-closed { color: var(--c-muted); }

/* Ficha emergente sobre el mapa */
.ficha .leaflet-popup-content-wrapper { border-radius: var(--radius-md); padding: 0; overflow: hidden; }
.ficha .leaflet-popup-content { margin: 0; width: 250px !important; }
.ficha img { width: 100%; height: 120px; object-fit: cover; display: block; background: var(--c-cream-deep); }
.ficha__txt { padding: 12px 14px 14px; display: grid; gap: 4px; }
.ficha__txt strong { font-size: 1rem; }
.ficha__txt span { color: var(--c-muted); font-size: .82rem; }
.ficha__acc { display: flex; gap: 8px; margin-top: 8px; }
.ficha__acc a {
  flex: 1; text-align: center; text-decoration: none; font-size: .8rem; font-weight: 700;
  padding: 8px 10px; border-radius: var(--radius-pill);
}
.ficha__acc a:first-child { background: var(--c-navy); color: #fff; }
.ficha__acc a:last-child { border: 1px solid var(--c-line); color: var(--c-navy); }

/* Botón X para quitar filtros */
.quitar {
  display: none; align-items: center; justify-content: center; gap: 6px;
  height: 40px; min-width: 40px; padding: 0 12px;
  border-radius: var(--radius-pill); border: 0;
  background: var(--c-ink); color: #fff; font-weight: 700; font-size: .85rem;
  box-shadow: var(--shadow-chip); flex: none;
}
.quitar.is-visible { display: inline-flex; }

/* Menú desplegable de un filtro (A y C) */
.pop {
  position: fixed; z-index: 1500; min-width: 210px; max-height: 60vh; overflow: auto;
  background: #fff; border-radius: var(--radius-sm); box-shadow: var(--shadow-soft);
  padding: 6px; display: none;
}
.pop.is-open { display: block; }
.pop button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: .9rem;
}
.pop button:hover { background: var(--c-cream); }
.pop button.is-on { background: #fde6da; color: var(--c-coral-dark); font-weight: 700; }
.pop .punto { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pop .vacio { color: var(--c-muted); font-size: .85rem; padding: 10px 12px; }

/* Velo para ventanas emergentes en móvil */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1200; opacity: 0; pointer-events: none; transition: opacity .2s; }
.velo.is-open { opacity: 1; pointer-events: auto; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<style>
/* ===== Propuesta C · Panel plegable + categorías a la vista ===== */
.app { display: grid; grid-template-columns: 380px 1fr; height: calc(100dvh - var(--header-h)); transition: grid-template-columns .25s ease; }
.app.is-plegado { grid-template-columns: 0 1fr; }
.lado { display: flex; flex-direction: column; background: #fff; min-height: 0; z-index: 2; overflow: hidden; box-shadow: 4px 0 18px rgba(0,0,0,.06); }
.lado__cab { padding: 18px 18px 10px; display: grid; gap: 10px; min-width: 380px; }
.lado__fila { display: flex; align-items: center; gap: 10px; }
.lado__fila h1 { font-family: var(--font-serif); font-size: 1.35rem; color: var(--c-navy); margin: 0; flex: 1; }
.plegar { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--c-line); background: #fff; font-size: 1rem; color: var(--c-navy); }

.buscar { position: relative; display: block; }
.buscar svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); stroke: var(--c-muted); fill: none; stroke-width: 2; }
.buscar input { width: 100%; height: 46px; padding: 0 14px 0 42px; border-radius: var(--radius-pill); border: 1px solid var(--c-line); background: var(--c-cream); outline: none; }
.buscar input:focus { border-color: var(--c-navy); background: #fff; }
.cuenta { margin: 0; font-size: .82rem; color: var(--c-muted); }

.lista { list-style: none; margin: 0; padding: 4px 18px 24px; overflow: auto; flex: 1; display: grid; gap: 12px; align-content: start; min-width: 380px; }
.lugar {
  display: grid; grid-template-columns: 96px 1fr; width: 100%; padding: 0; overflow: hidden;
  border: 1px solid var(--c-line); border-radius: var(--radius-md); background: #fff; text-align: left;
  transition: box-shadow .15s, border-color .15s;
}
.lugar:hover { box-shadow: var(--shadow-chip); }
.lugar.is-sel { border-color: var(--c-coral); box-shadow: 0 0 0 2px var(--c-coral); }
.lugar img.foto { width: 96px; height: 100%; min-height: 92px; object-fit: cover; background: var(--c-cream-deep); }
.lugar__txt { padding: 10px 12px; display: grid; gap: 3px; min-width: 0; }
.lugar__txt strong { font-size: .95rem; line-height: 1.2; }
.lugar__txt .sub { font-size: .76rem; color: var(--c-muted); display: flex; align-items: center; gap: 6px; }
.lugar__txt .sub i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.lugar__pie { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
.sin { padding: 28px 8px; color: var(--c-muted); font-size: .9rem; text-align: center; }

.escena { position: relative; min-width: 0; }
.mostrar {
  display: none; position: absolute; z-index: 1100; left: 16px; bottom: 24px; align-items: center; gap: 8px;
  height: 44px; padding: 0 16px; border-radius: var(--radius-pill); border: 0; background: var(--c-navy); color: #fff; font-weight: 700; box-shadow: var(--shadow-soft);
}
.app.is-plegado .mostrar { display: inline-flex; }

/* Filtros: categorías a la vista + menús */
.filtros {
  position: absolute; z-index: 1100; top: 16px; left: 16px; right: 16px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none;
}
.filtros > * { pointer-events: auto; }
.sep { width: 1px; height: 28px; background: rgba(0,0,0,.15); flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px;
  border-radius: var(--radius-pill); border: 0; background: #fff; color: var(--c-ink);
  font-weight: 500; font-size: .88rem; box-shadow: var(--shadow-chip); white-space: nowrap; flex: none;
}
.chip img { width: 26px; height: 26px; }
.chip--menu { padding: 0 14px; }
.chip:hover { background: var(--c-cream); }
.chip .flecha { font-size: .65rem; opacity: .7; }
.chip.is-on { background: var(--c-coral); color: #fff; font-weight: 700; }
.chip.is-on:hover { background: var(--c-coral-dark); }
.chip--check { cursor: pointer; padding: 0 14px; }
.chip--check input { width: 18px; height: 18px; margin: 0; accent-color: var(--c-coral-dark); }

.fab, .modal { display: none; }

@media (max-width: 760px) {
  .app, .app.is-plegado { display: block; position: relative; }
  .escena { position: absolute; inset: 0; }
  .lado { position: absolute; z-index: 1150; top: 12px; left: 12px; width: calc(100% - 24px); background: none; box-shadow: none; overflow: visible; display: block; }
  .lado__cab { padding: 0; min-width: 0; }
  .lado__fila, .lado .cuenta, .lado .lista, .mostrar, .app.is-plegado .mostrar { display: none; }
  .buscar input { background: #fff; border: 0; box-shadow: var(--shadow-chip); }
  .filtros { top: 66px; left: 0; right: 0; padding: 4px 12px 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .quitar { order: -1; }

  .fab {
    display: grid; place-items: center; position: absolute; z-index: 1100; right: 16px; bottom: 28px;
    width: 56px; height: 56px; border-radius: 18px; border: 0; background: #fff; color: var(--c-navy); box-shadow: var(--shadow-soft);
  }
  .fab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .fab__n { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--c-navy); color: #fff; font-size: .72rem; font-weight: 700; display: grid; place-items: center; }

  /* Ventana flotante con márgenes: se ve el mapa detrás */
  .modal {
    display: flex; flex-direction: column; position: fixed; z-index: 1300; left: 12px; right: 12px;
    top: calc(var(--header-h) + 16px); bottom: 16px; background: #fff; border-radius: 20px; box-shadow: var(--shadow-soft);
    opacity: 0; transform: scale(.96); pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .modal.is-open { opacity: 1; transform: none; pointer-events: auto; }
  .modal__cab { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--c-line); }
  .modal__cab h2 { margin: 0; font-size: 1.05rem; }
  .modal__cab small { display: block; color: var(--c-muted); font-weight: 400; font-size: .78rem; }
  .cerrar { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--c-cream); font-size: 1.05rem; }
  .modal .lista { display: grid; min-width: 0; padding: 12px; }
  .lugar { grid-template-columns: 84px 1fr; }
  .lugar img.foto { width: 84px; min-height: 84px; }
}
</style>
</head>

  <button class="sitio__menu" aria-label="Menú">☰</button>
</header>

<div class="app" id="app">
  <aside class="lado" aria-label="Lugares del mapa">

      <div class="lado__fila">
        <h1>Explora el mapa</h1>
        <button type="button" class="plegar" id="plegar" aria-label="Ocultar lista" title="Ocultar lista">«</button>
      </div>
      <label class="buscar">
        <span class="sr">Buscar lugares</span>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Buscar lugares, tipos…" autocomplete="off">
      </label>
      <p class="cuenta" id="cuenta" aria-live="polite"></p>
    </div>
    <ul class="lista" id="lista"></ul>
  </aside>

  <main class="escena">
    <div id="mapa"></div>
    <div class="filtros" role="toolbar" aria-label="Filtros del mapa">
      <span id="cats" style="display:contents"></span>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="chip chip--menu" id="f-nota" aria-haspopup="menu" aria-expanded="false"></button>
      <button type="button" class="chip chip--menu" id="f-tipo" aria-haspopup="menu" aria-expanded="false"></button>

      <button type="button" class="quitar" id="quitar" aria-label="Quitar filtros">✕</button>
    </div>
    <button type="button" class="mostrar" id="mostrar">☰ Ver lista (<span id="mostrar-n"></span>)</button>
    <button type="button" class="fab" id="fab" aria-label="Ver lista de lugares" aria-controls="modal">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      <span class="fab__n" id="fab-n"></span>
    </button>
  </main>
</div>

<div class="velo" id="velo"></div>
<section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-t">
  <div class="modal__cab">
    <h2 id="modal-t"><span id="modal-n"></span><small id="modal-f"></small></h2>
    <button type="button" class="cerrar" id="cerrar" aria-label="Cerrar lista y volver al mapa">✕</button>
  </div>
  <ul class="lista" id="lista-m"></ul>
</section>

    ['Bisutería MG','e','comprar','Artesanía',0,null,7.923257,-72.791304,'artesanias','/media/establishments/25/41f57c08-0378-494a-bab4-6aaee0d94822-cover.webp'],
    ['Caliopes','e','comprar','Artesanía',0,null,7.9083831,-72.8306801,'artesanias','/media/establishments/24/5e71a41c-76c2-4638-b6b9-9e64ba28b6dd-cover.webp'],
    ['El Sabor Gramalotero','e','comer','Restaurante',0,null,7.9172,-72.7899,'restaurante','/media/establishments/28/f0ada12f-7b06-447b-87f0-215ef2a6435a-cover.webp'],
    ['Lonchería Romero','e','comer','Restaurante',0,false,7.915291,-72.786325,'comidas-ejecutivas','/media/establishments/27/ec994c9c-21db-44c3-a494-bf8fa9fc307d-cover.webp'],
    ['Sombreros TECHA','e','comprar','Artesanía',0,false,7.9161583,-72.7875621,'artesanias','/media/establishments/26/95df01ed-1b51-4945-8e8e-c31cc0e7d459-cover.webp'],
    ['Yawart','e','comprar','Artesanía',0,null,7.9195026,-72.7847273,'artesanias','/media/establishments/23/055eb98c-397f-42c4-abea-50f96b01a80f-cover.webp'],
    ['Pueblo Viejo','x','experiencia','Patrimonio',0,null,7.9015955,-72.7983908,'monumento','/img/que-hacer/pueblo-viejo.jpg'],
    ['Las ruinas del antiguo Gramalote','x','experiencia','Patrimonio',0,null,7.8878061,-72.7977203,'monumento','/img/que-hacer/ruinas.jpg'],
    ['Nuevo Gramalote','x','experiencia','Patrimonio',0,null,7.9150179,-72.7855365,'monumento','/img/que-hacer/nuevo-gramalote.jpg'],
    ['Cascadas Arco Iris','x','experiencia','Naturaleza',0,null,7.8827262,-72.7803418,'cascada','/img/experiencias/cascadas/hero.jpg'],
    ['Café Marquetalia','x','experiencia','Naturaleza',0,null,7.93,-72.796,'cafeteria','/img/que-hacer/marquetalia.jpg'],
  ]

  const PLACES = RAW.map((r, i) => ({
    id: 'p' + i,
    name: r[0],
    group: r[2],
    categoryName: GROUP[r[2]].label,
    type: r[3],
    rating: r[4],
    openNow: r[5],
    lat: r[6],
    lng: r[7],
    icon: ICONOS + r[8] + '.svg',
    photo: BASE + r[9],
  }))

  const RATINGS = [
    { value: 0, label: 'Cualquiera' },
    { value: 1, label: '1+' },
    { value: 2, label: '2+' },
    { value: 3, label: '3+' },
    { value: 4, label: '4+' },
    { value: 5, label: '5' },
  ]

  // ---------- Estado y filtrado ----------
  const state = { q: '', group: '', minRating: 0, type: '', open: false, selected: '' }
  const listeners = []

  const normalize = (v) =>
    String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, '')

  function typesFor(group) {
    const set = new Set(PLACES.filter((p) => !group || p.group === group).map((p) => p.type))
    return [...set].sort((a, b) => a.localeCompare(b, 'es'))
  }

  function filtered() {
    const q = normalize(state.q)
    return PLACES.filter(
      (p) =>
        (!state.group || p.group === state.group) &&
        (!state.type || p.type === state.type) &&
        p.rating >= state.minRating &&
        (!state.open || p.openNow === true) &&
        (!q || normalize(p.name + p.type + p.categoryName).includes(q)),
    ).sort((a, b) => b.rating - a.rating || a.name.localeCompare(b.name, 'es'))
  }

  // La búsqueda no cuenta como filtro: la X solo limpia los filtros de la barra.
  function activeCount() {
    return (state.group ? 1 : 0) + (state.minRating ? 1 : 0) + (state.type ? 1 : 0) + (state.open ? 1 : 0)
  }

  function set(patch) {
    Object.assign(state, patch)
    if ('group' in patch && state.type && !typesFor(state.group).includes(state.type)) state.type = ''
    listeners.forEach((fn) => fn(state))
  }
  function clearFilters() {
    set({ group: '', minRating: 0, type: '', open: false })
  }
  function onChange(fn) {
    listeners.push(fn)
  }

  // ---------- Fragmentos de HTML ----------
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>'
  const fmt = (n) => n.toLocaleString('es-CO', { maximumFractionDigits: 1 })

  function nota(avg) {
    return `<span class="nota${avg ? '' : ' is-cero'}" aria-label="Calificación ${fmt(avg)} de 5">${fmt(avg)}${STAR}</span>`
  }
  function estrellas(n) {
    let html = '<span class="estrellas" aria-hidden="true">'
    for (let i = 1; i <= 5; i++) html += STAR.replace('<svg', i <= n ? '<svg' : '<svg class="vacia"')
    return html + '</span>'
  }
  function estado(p) {
    if (p.openNow === true) return '<span class="estado is-open">Abierto</span>'
    if (p.openNow === false) return '<span class="estado is-closed">Cerrado</span>'
    return ''
  }
  const subtitulo = (p) => `${p.categoryName} · ${p.type}`
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

  // ---------- Mapa (Leaflet solo para el prototipo; producción usa MapLibre) ----------
  function initMap(el, opts = {}) {
    const map = L.map(el, { zoomControl: false, attributionControl: true }).setView([7.912, -72.789], 14)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap',
    }).addTo(map)
    L.control.zoom({ position: opts.zoomPosition || 'bottomright' }).addTo(map)

    const markers = {}
    PLACES.forEach((p) => {
      const m = L.marker([p.lat, p.lng], {
        icon: L.divIcon({ className: 'pin', html: `<img src="${p.icon}" alt="">`, iconSize: [40, 40], iconAnchor: [20, 36] }),
        title: p.name,
      })
      m.on('click', () => select(p.id))
      markers[p.id] = m
    })

    function popupHtml(p) {
      return `<img src="${p.photo}" alt="" onerror="this.style.visibility='hidden'">
        <div class="ficha__txt"><strong>${esc(p.name)}</strong><span>${esc(subtitulo(p))}</span>
        <div style="display:flex;gap:10px;align-items:center">${nota(p.rating)} ${estado(p)}</div>
        <div class="ficha__acc"><a href="#">Ver ficha</a><a href="#">Cómo llegar</a></div></div>`
    }

    function select(id, fly) {
      const p = PLACES.find((x) => x.id === id)
      if (!p) return
      Object.values(markers).forEach((m) => m.getElement()?.classList.remove('is-sel'))
      markers[id].getElement()?.classList.add('is-sel')
      if (fly) map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 16), { duration: 0.5 })
      L.popup({ className: 'ficha', offset: [0, -30], maxWidth: 260, autoPanPaddingTopLeft: opts.padTL || [20, 120] })
        .setLatLng([p.lat, p.lng]).setContent(popupHtml(p)).openOn(map)
      set({ selected: id })
    }

    let lastKey = ''
    function render() {
      const list = filtered()
      const visible = new Set(list.map((p) => p.id))
      PLACES.forEach((p) => {
        const m = markers[p.id]
        if (visible.has(p.id)) m.addTo(map)
        else m.remove()
      })
      const key = list.map((p) => p.id).join()
      if (key !== lastKey && list.length) {
        lastKey = key
        map.invalidateSize()
        map.fitBounds(L.latLngBounds(list.map((p) => [p.lat, p.lng])), {
          paddingTopLeft: opts.padTL || [40, 120], paddingBottomRight: [40, 40], maxZoom: 16,
        })
      }
    }
    onChange(render)
    render()
    return { map, select }
  }

  // ---------- Menú desplegable posicionado bajo un chip ----------
  const pop = document.createElement('div')
  pop.className = 'pop'
  pop.setAttribute('role', 'menu')
  document.addEventListener('DOMContentLoaded', () => document.body.append(pop))
  let popAnchor = null
  function openPop(anchor, items, onPick) {
    if (popAnchor === anchor && pop.classList.contains('is-open')) return closePop()
    popAnchor = anchor
    pop.innerHTML = ''
    if (!items.length) pop.innerHTML = '<div class="vacio">Sin opciones</div>'
    items.forEach((it) => {
      const b = document.createElement('button')
      b.type = 'button'
      b.setAttribute('role', 'menuitemradio')
      b.setAttribute('aria-checked', String(!!it.on))
      if (it.on) b.className = 'is-on'
      b.innerHTML = it.html
      b.addEventListener('click', () => { onPick(it.value); closePop() })
      pop.append(b)
    })
    const r = anchor.getBoundingClientRect()
    pop.classList.add('is-open')
    const w = pop.offsetWidth
    pop.style.top = r.bottom + 6 + 'px'
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px'
    anchor.setAttribute('aria-expanded', 'true')
  }
  function closePop() {
    pop.classList.remove('is-open')
    popAnchor?.setAttribute('aria-expanded', 'false')
    popAnchor = null
  }
  document.addEventListener('click', (e) => {
    if (popAnchor && !pop.contains(e.target) && !popAnchor.contains(e.target)) closePop()
  })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop() })
  addEventListener('resize', closePop)
  document.addEventListener('scroll', closePop, true)

  // Opciones listas para los menús
  const groupItems = () => [
    { value: '', html: 'Todas las categorías', on: !state.group },
    ...GROUPS.map((g) => ({ value: g.key, on: state.group === g.key, html: `<span class="punto" style="background:${g.color}"></span>${g.label}` })),
  ]
  const ratingItems = () =>
    RATINGS.map((r) => ({
      value: r.value, on: state.minRating === r.value,
      html: r.value ? `<b style="min-width:22px">${r.label}</b>${estrellas(r.value)}` : 'Cualquier calificación',
    }))
  const typeItems = () => [
    { value: '', html: 'Todos los tipos', on: !state.type },
    ...typesFor(state.group).map((t) => ({ value: t, html: esc(t), on: state.type === t })),
  ]

  window.Mapa = {
    GROUPS, GROUP, PLACES, RATINGS, STAR, state, set, clearFilters, onChange, filtered, typesFor, activeCount,
    nota, estrellas, estado, subtitulo, esc, initMap, openPop, closePop, groupItems, ratingItems, typeItems,
    isMobile: () => matchMedia('(max-width: 760px)').matches,
  }
})()
</script>
<script>
const M = window.Mapa
const $ = (id) => document.getElementById(id)
const mapa = M.initMap($('mapa'), { padTL: [40, 90] })
const flecha = ' <span class="flecha" aria-hidden="true">▼</span>'

// Una pastilla por categoría, con su icono; tocar la activa la desactiva.
$('cats').innerHTML = M.GROUPS.map((g) =>
  `<button type="button" class="chip" data-g="${g.key}" aria-pressed="false"><img src="../../frontend/public/img/mapa/iconos/${g.icon}.svg" alt="">${g.short}</button>`).join('')
$('cats').addEventListener('click', (e) => {
  const b = e.target.closest('[data-g]')
  if (b) M.set({ group: M.state.group === b.dataset.g ? '' : b.dataset.g })
})
$('q').addEventListener('input', (e) => M.set({ q: e.target.value }))
$('abierto').addEventListener('change', (e) => M.set({ open: e.target.checked }))
$('quitar').addEventListener('click', M.clearFilters)
$('f-nota').addEventListener('click', (e) => M.openPop(e.currentTarget, M.ratingItems(), (v) => M.set({ minRating: v })))
$('f-tipo').addEventListener('click', (e) => M.openPop(e.currentTarget, M.typeItems(), (v) => M.set({ type: v })))

function plegar(v) {
  $('app').classList.toggle('is-plegado', v)
  setTimeout(() => mapa.map.invalidateSize(), 260)
}
$('plegar').addEventListener('click', () => plegar(true))
$('mostrar').addEventListener('click', () => plegar(false))

function abrir(v) {
  $('modal').classList.toggle('is-open', v)
  $('velo').classList.toggle('is-open', v)
  if (v) $('cerrar').focus()
}
$('fab').addEventListener('click', () => abrir(true))
$('cerrar').addEventListener('click', () => abrir(false))
$('velo').addEventListener('click', () => abrir(false))
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') abrir(false) })
document.addEventListener('click', (e) => {
  const b = e.target.closest('.lugar')
  if (!b) return
  abrir(false)
  mapa.select(b.dataset.id, true)
})

function item(p, s) {
  const g = M.GROUP[p.group]
  return `<li><button type="button" class="lugar${s.selected === p.id ? ' is-sel' : ''}" data-id="${p.id}">
    <img class="foto" src="${p.photo}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <span class="lugar__txt"><strong>${M.esc(p.name)}</strong>
      <span class="sub"><i style="background:${g.color}"></i>${M.esc(M.subtitulo(p))}</span>
      <span class="lugar__pie">${M.nota(p.rating)}${M.estado(p)}</span></span></button></li>`
}

function render(s) {
  const list = M.filtered()
  document.querySelectorAll('[data-g]').forEach((b) => {
    const on = s.group === b.dataset.g
    b.classList.toggle('is-on', on)
    b.setAttribute('aria-pressed', String(on))
  })
  $('f-nota').innerHTML = (s.minRating ? `${M.RATINGS.find((r) => r.value === s.minRating).label} ${M.STAR.replace('<svg', '<svg width="14" height="14" fill="currentColor"')}` : 'Calificación') + flecha
  $('f-nota').classList.toggle('is-on', !!s.minRating)
  $('f-tipo').innerHTML = (s.type ? M.esc(s.type) : 'Tipo') + flecha
  $('f-tipo').classList.toggle('is-on', !!s.type)
  $('abierto').checked = s.open
  $('f-abierto').classList.toggle('is-on', s.open)
  const n = M.activeCount()
  $('quitar').classList.toggle('is-visible', n > 0)

  const html = list.length ? list.map((p) => item(p, s)).join('') : '<li class="sin">Ningún lugar coincide. Prueba quitando algún filtro.</li>'
  $('lista').innerHTML = html
  $('lista-m').innerHTML = html
  const t = `${list.length} ${list.length === 1 ? 'lugar' : 'lugares'}`
  $('cuenta').textContent = t
  $('modal-n').textContent = t
  $('modal-f').textContent = n || s.q ? 'Según tu búsqueda y filtros' : 'Todos los lugares'
  $('fab-n').textContent = list.length
  $('mostrar-n').textContent = list.length
}
M.onChange(render)
render(M.state)
</script>
</body>
</html>
