name: gramalote-db

services:
  mysql:
    image: mysql:8.4
    container_name: gramalote-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en backend/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gramalote}
      MYSQL_USER: ${MYSQL_USER:-gramalote}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en backend/.env}
      TZ: America/Bogota
    command: --default-time-zone=-05:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - gramalote_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/seed-content.sql:/docker-entrypoint-initdb.d/03-seed-content.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  gramalote_mysql_data:
