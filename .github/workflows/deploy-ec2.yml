name: CI/CD · EC2

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: gramalote-frontend
  ECR_REPOSITORY_API: gramalote-api
  INSTANCE_ID: i-007da8f731134e78d
  APP_DIR: /opt/gramalote
  CLOUDFRONT_DISTRIBUTION_ID: E1P9GLTGDGI4RL

jobs:
  build:
    name: Build y push a ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      api_image: ${{ steps.meta.outputs.api_image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Instalar dependencias (frontend)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Instalar dependencias (backend)
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Lint (backend)
        working-directory: backend
        run: npm run lint

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Asegurar repositorio ECR de la API
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY_API" >/dev/null 2>&1 \
            || aws ecr create-repository \
                 --repository-name "$ECR_REPOSITORY_API" \
                 --image-scanning-configuration scanOnPush=true \
                 --query "repository.repositoryName" --output text

      - name: Calcular tags
        id: meta
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${ECR_REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${ECR_REPOSITORY_API}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push (frontend)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: VITE_BASE=/
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build y push (API)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Desplegar en EC2 (SSM)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://d2nm90ise1l8de.cloudfront.net
    steps:
      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ejecutar despliegue vía SSM
        id: ssm
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: |
          COMPOSE_URL="$RAW_BASE/docker-compose.yml"
          SCRIPT_URL="$RAW_BASE/deploy/deploy.sh"
          COMANDO="export AWS_REGION=$AWS_REGION ECR_REPO=$ECR_REPOSITORY ECR_REPO_API=$ECR_REPOSITORY_API IMAGE_TAG=$IMAGE_TAG COMPOSE_URL=$COMPOSE_URL; curl -fsSL $SCRIPT_URL -o /tmp/gramalote-deploy.sh && bash /tmp/gramalote-deploy.sh"
          PARAMS=$(printf '{"commands":["%s"]}' "$COMANDO")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_TAG}" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Esperar resultado
        run: aws ssm wait command-executed --command-id "${{ steps.ssm.outputs.command_id }}" --instance-id "$INSTANCE_ID"

      - name: Mostrar salida del despliegue
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Salida:StandardOutputContent,Errores:StandardErrorContent}" \
            --output json

      - name: Invalidar caché de CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Invalidación $INVALIDATION_ID creada"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
          echo "Caché propagada"
