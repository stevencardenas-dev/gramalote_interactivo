name: CI/CD · EC2

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: gramalote-frontend
  INSTANCE_ID: i-007da8f731134e78d
  APP_DIR: /opt/gramalote

jobs:
  build:
    name: Build y push a ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calcular tags
        id: meta
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${ECR_REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: VITE_BASE=/
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Desplegar en EC2 (SSM)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: http://3.129.15.147
    steps:
      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ejecutar despliegue vía SSM
        id: ssm
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          COMPOSE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
        run: |
          PARAMS=$(printf '{"commands":["export AWS_REGION=%s ECR_REPO=%s IMAGE_TAG=%s COMPOSE_URL=%s; bash %s/deploy.sh"]}' \
            "$AWS_REGION" "$ECR_REPOSITORY" "$IMAGE_TAG" "$COMPOSE_URL" "$APP_DIR")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${IMAGE_TAG}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Esperar resultado
        run: aws ssm wait command-executed --command-id "${{ steps.ssm.outputs.command_id }}" --instance-id "$INSTANCE_ID"

      - name: Mostrar salida del despliegue
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Salida:StandardOutputContent,Errores:StandardErrorContent}" \
            --output json
